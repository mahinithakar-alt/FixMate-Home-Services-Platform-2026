<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking details — Super Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
<link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">
<div class="sidebar-backdrop" id="sbBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar">
  <div class="brand"><i class="bi bi-tools"></i> FixMate Admin</div>
  <ul class="nav flex-column pb-3">
    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="technicians.html"><i class="bi bi-people"></i> Technicians</a></li>
    <li class="nav-item"><a class="nav-link" href="categories.html"><i class="bi bi-tags"></i> Categories</a></li>
    <li class="nav-item"><a class="nav-link" href="services.html"><i class="bi bi-tools"></i> Services</a></li>
    <li class="nav-item"><a class="nav-link active" href="bookings.html"><i class="bi bi-journal-text"></i> Bookings</a></li>
    <li class="nav-item"><a class="nav-link" href="pricing.html"><i class="bi bi-cash-coin"></i> Pricing &amp; Payments</a></li>
    <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-graph-up"></i> Reviews &amp; Reports</a></li>
    <li class="nav-item"><a class="nav-link" href="settings.html"><i class="bi bi-gear"></i> Settings</a></li>
    <li><hr class="border-secondary mx-3"></li>
    <li class="nav-item"><a class="nav-link" href="#" id="logout-link"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
  </ul>
</aside>

<main class="admin-content">
  <div class="admin-topbar d-flex align-items-center justify-content-between py-2 px-3 rounded mb-4">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-lg-none" id="sb-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <h1 class="h5 mb-0 fw-semi" id="bd-title">Booking details</h1>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span id="bd-status"></span>
      <a class="btn btn-sm btn-outline-secondary" href="bookings.html"><i class="bi bi-arrow-left"></i> All bookings</a>
    </div>
  </div>

  <div id="bd-wrap"></div>
</main>

<div class="modal fade" id="assignModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Assign technician</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
    <label class="form-label" for="assign-tech">Technician (slot-conflicted options are disabled)</label>
    <select id="assign-tech" class="form-select"></select>
  </div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="assign-save">Assign</button></div>
</div></div></div>
<div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Update status</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
    <label class="form-label" for="status-next">New status (allowed transitions only)</label>
    <select id="status-next" class="form-select mb-3"></select>
    <label class="form-label" for="status-note">Note (required for cancellation)</label>
    <textarea id="status-note" class="form-control" rows="2"></textarea>
  </div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="status-save">Update</button></div>
</div></div></div>
<div class="modal fade" id="reschedModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Reschedule appointment</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
    <label class="form-label" for="resched-date">New date</label><input type="date" id="resched-date" class="form-control mb-3">
    <label class="form-label" for="resched-slot">New time slot</label><select id="resched-slot" class="form-select"></select>
  </div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="resched-save">Reschedule</button></div>
</div></div></div>
<div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Cancel booking</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
    <label class="form-label required" for="cancel-reason">Cancellation reason (recorded in history)</label>
    <textarea id="cancel-reason" class="form-control" rows="2"></textarea>
  </div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Keep booking</button><button class="btn btn-danger" id="cancel-save">Cancel booking</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
