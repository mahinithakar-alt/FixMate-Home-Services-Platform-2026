<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Availability — Technician</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
<link href="../assets/css/technician.css" rel="stylesheet">
</head>
<body class="tech-body">
<aside class="tech-sidebar" id="techSidebar">
  <div class="brand"><i class="bi bi-person-badge"></i> Technician Panel</div>
  <ul class="nav flex-column pb-3">
    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i> My Profile</a></li>
    <li class="nav-item"><a class="nav-link active" href="availability.html"><i class="bi bi-calendar-week"></i> Availability</a></li>
    <li class="nav-item"><a class="nav-link" href="assigned-jobs.html"><i class="bi bi-list-task"></i> Assigned Jobs</a></li>
    <li class="nav-item"><a class="nav-link" href="job-history.html"><i class="bi bi-clock-history"></i> Job History</a></li>
    <li class="nav-item"><a class="nav-link" href="earnings.html"><i class="bi bi-cash-coin"></i> Earnings</a></li>
    <li><hr class="border-secondary mx-3"></li>
    <li class="nav-item"><a class="nav-link" href="#" id="logout-link"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
  </ul>
</aside>

<main class="tech-content">
  <div class="tech-topbar d-flex align-items-center justify-content-between py-2 px-3 rounded mb-4">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-lg-none" id="sb-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <h1 class="h5 mb-0 fw-semi">Availability</h1>
    </div>
    <div class="dropdown">
      <button class="btn btn-light btn-sm border d-flex align-items-center gap-2" data-bs-toggle="dropdown"><span class="avatar-circle" style="background:#e7f6ef;color:#0f6e4f" id="tech-avatar">T</span><span id="tech-name">…</span></button>
      <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item text-danger" href="#" id="logout-link-2">Logout</a></li></ul>
    </div>
  </div>

  <div id="avail-form" class="card p-4" style="max-width:860px">
    <h6 class="fw-semi">Working days</h6>
    <p class="small text-muted">Click the days you work.</p>
    <div id="av-days" class="mb-4"></div>

    <h6 class="fw-semi">Available time slots</h6>
    <p class="small text-muted">Click the slots you can take jobs in.</p>
    <div id="av-slots" class="mb-4"></div>

    <h6 class="fw-semi">Daily break</h6>
    <div class="row g-3 mb-4">
      <div class="col-md-3"><label class="form-label" for="av-breakfrom">Break from</label><input type="time" id="av-breakfrom" class="form-control"></div>
      <div class="col-md-3"><label class="form-label" for="av-breakto">Break to</label><input type="time" id="av-breakto" class="form-control"></div>
    </div>

    <h6 class="fw-semi">Unavailable dates</h6>
    <div class="mb-4">
      <label class="form-label" for="av-dates">Comma-separated dates (YYYY-MM-DD)</label>
      <input id="av-dates" class="form-control" placeholder="2026-10-15, 2026-10-16">
    </div>

    <div class="form-check form-switch mb-4">
      <input class="form-check-input" type="checkbox" id="av-online" role="switch">
      <label class="form-check-label" for="av-online"><strong>Available / online</strong> — untick to appear unavailable for new assignments.</label>
    </div>

    <button class="btn btn-brand" id="avail-save"><i class="bi bi-save"></i> Save availability</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/technician.js"></script>
<script>document.getElementById('logout-link-2')?.addEventListener('click',e=>{e.preventDefault();window.HSP.logout();});
setTimeout(()=>{const el=document.getElementById('tech-avatar');if(el){const n=document.getElementById('tech-name').textContent;el.textContent=n.split(' ').map(x=>x[0]).join('').slice(0,2)||'T';}},50);</script>
</body>
</html>
