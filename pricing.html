  <div class="brand"><i class="bi bi-tools"></i> FixMate Admin</div>
  <ul class="nav flex-column pb-3">
    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="technicians.html"><i class="bi bi-people"></i> Technicians</a></li>
    <li class="nav-item"><a class="nav-link" href="categories.html"><i class="bi bi-tags"></i> Categories</a></li>
    <li class="nav-item"><a class="nav-link" href="services.html"><i class="bi bi-tools"></i> Services</a></li>
    <li class="nav-item"><a class="nav-link" href="bookings.html"><i class="bi bi-journal-text"></i> Bookings</a></li>

  </ul>

<main class="admin-content">
  <div class="admin-topbar d-flex align-items-center justify-content-between py-2 px-3 rounded mb-4">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-lg-none" id="sb-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <h1 class="h5 mb-0 fw-semi">Pricing &amp; Payments</h1>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="dropdown">
        <button class="btn btn-light btn-sm border d-flex align-items-center gap-2" data-bs-toggle="dropdown"><span class="avatar-circle">SA</span><span class="d-none d-md-inline">Super Admin</span></button>

      </div>
    </div>
  </div>

  <div class="row g-3 mb-4" id="pr-cards"></div>

  <div class="filter-bar p-3 mb-4">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-lg-4"><label class="form-label small" for="pr-search">Search booking / customer</label><input id="pr-search" class="form-control form-control-sm" type="search"></div>
      <div class="col-6 col-lg-4"><label class="form-label small" for="pr-status">Payment status</label><select id="pr-status" class="form-select form-select-sm"><option value="">All</option><option>Pending</option><option>Paid</option></select></div>
    </div>
  </div>

  <div class="card p-3">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead><tr><th>Booking</th><th>Customer</th><th>Service</th><th>Estimated</th><th>Final price</th><th>Method (sample)</th><th>Payment status</th><th>Commission / Technician</th></tr></thead>
        <tbody id="pr-table-body"></tbody>
      </table>
    </div>
    <p class="small text-muted mb-0" id="pr-note"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
