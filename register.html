<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — FixMate Home Services</title>
<link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg hsp-navbar" data-bs-theme="dark">
  <div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><img src="assets/images/logo.svg" alt="FixMate logo" class="logo-img"><span class="brand-wrap"><span class="brand-script">FixMate</span><small class="nav-tagline d-none d-xl-block">Connecting You with the Right Service Professionals</small></span></a></div>
</nav>

<section class="section-pad">
  <div class="container" style="max-width:480px">
    <h1 class="h3 fw-bold text-center">Create your account</h1>
    <p class="text-muted text-center mb-4">Customers can register to book services and track their bookings.</p>
    <div class="card p-4">
      <form id="register-form" novalidate>
        <div class="mb-3"><label class="form-label required" for="r-name">Full name</label><input id="r-name" class="form-control" autocomplete="name"><div class="invalid-feedback"></div></div>
        <div class="mb-3"><label class="form-label required" for="r-email">Email</label><input id="r-email" class="form-control" type="email" autocomplete="email"><div class="invalid-feedback"></div></div>
        <div class="mb-3"><label class="form-label required" for="r-phone">Phone</label><input id="r-phone" class="form-control" type="tel" placeholder="+1 555 000 0000"><div class="invalid-feedback"></div></div>
        <div class="mb-3"><label class="form-label required" for="r-pass">Password (min 8 characters)</label><input id="r-pass" class="form-control" type="password" autocomplete="new-password"><div class="invalid-feedback"></div></div>
        <div class="alert alert-danger py-2 small d-none" id="reg-error"></div>
        <button class="btn btn-brand w-100" id="reg-btn" type="submit"><i class="bi bi-person-plus"></i> Create account</button>
      </form>
      <hr>
      <p class="small text-muted mb-0">Already registered? <a href="login.html">Sign in</a></p>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function(){
  document.getElementById('register-form').addEventListener('submit',async function(e){
    e.preventDefault();
    const errBox=document.getElementById('reg-error');errBox.classList.add('d-none');
    const name=document.getElementById('r-name').value.trim();
    const email=document.getElementById('r-email').value.trim();
    const phone=document.getElementById('r-phone').value.trim();
    const password=document.getElementById('r-pass').value;
    if(!name||!email||!phone||password.length<8){errBox.textContent='Please fill all fields (password at least 8 characters).';errBox.classList.remove('d-none');return;}
    const btn=document.getElementById('reg-btn');btn.disabled=true;
    try{
      await window.HSPApi.auth.register({name,email,phone,password});
      window.location.href='/index.html';
    }catch(err){errBox.textContent=err.message;errBox.classList.remove('d-none');btn.disabled=false;}
  });
})();
</script>
</body>
</html>
