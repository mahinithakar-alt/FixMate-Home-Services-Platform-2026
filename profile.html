<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile — Technician</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
<link href="../assets/css/technician.css" rel="stylesheet">
</head>
<body class="tech-body">
<aside class="tech-sidebar" id="techSidebar">
  <div class="brand"><i class="bi bi-person-badge"></i> Technician Panel</div>
  <ul class="nav flex-column pb-3">
    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li class="nav-item"><a class="nav-link active" href="profile.html"><i class="bi bi-person"></i> My Profile</a></li>
    <li class="nav-item"><a class="nav-link" href="availability.html"><i class="bi bi-calendar-week"></i> Availability</a></li>
    <li class="nav-item"><a class="nav-link" href="assigned-jobs.html"><i class="bi bi-list-task"></i> Assigned Jobs</a></li>
    <li class="nav-item"><a class="nav-link" href="job-history.html"><i class="bi bi-clock-history"></i> Job History</a></li>
    <li class="nav-item"><a class="nav-link" href="earnings.html"><i class="bi bi-cash-coin"></i> Earnings</a></li>
    <li><hr class="border-secondary mx-3"></li>
    <li class="nav-item"><a class="nav-link" href="#" id="logout-link"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
  </ul>
</aside>

<main class="tech-content">
  <div class="tech-topbar d-flex align-items-center justify-content-between py-2 px-3 rounded mb-4">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-lg-none" id="sb-toggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <h1 class="h5 mb-0 fw-semi">My Profile</h1>
    </div>
    <div class="dropdown">
      <button class="btn btn-light btn-sm border d-flex align-items-center gap-2" data-bs-toggle="dropdown"><span class="avatar-circle" style="background:#e7f6ef;color:#0f6e4f" id="tech-avatar">T</span><span id="tech-name">…</span></button>
      <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item text-danger" href="#" id="logout-link-2">Logout</a></li></ul>
    </div>
  </div>

  <div class="alert alert-secondary small" id="pf-readonly"></div>

  <form id="prof-form" class="card p-4" style="max-width:860px" novalidate>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label required" for="pf-name">Name</label><input id="pf-name" class="form-control"><div class="invalid-feedback"></div></div>
      <div class="col-md-6"><label class="form-label required" for="pf-phone">Contact phone</label><input id="pf-phone" class="form-control" type="tel"><div class="invalid-feedback"></div></div>
      <div class="col-md-6"><label class="form-label required" for="pf-email">Email</label><input id="pf-email" class="form-control" type="email"><div class="invalid-feedback"></div></div>
      <div class="col-md-6"><label class="form-label" for="pf-cat">Primary service category</label><select id="pf-cat" class="form-select"></select></div>
      <div class="col-md-6"><label class="form-label required" for="pf-skills">Skills</label><input id="pf-skills" class="form-control"><div class="invalid-feedback"></div></div>
      <div class="col-md-6"><label class="form-label required" for="pf-exp">Experience</label><input id="pf-exp" class="form-control"><div class="invalid-feedback"></div></div>
      <div class="col-12"><label class="form-label required" for="pf-areas">Service areas (comma-separated)</label><input id="pf-areas" class="form-control"><div class="invalid-feedback"></div></div>
      <div class="col-12"><label class="form-label" for="pf-photo">Profile photo (JPG/PNG/WebP, max 2 MB)</label><input id="pf-photo" class="form-control" type="file" accept="image/jpeg,image/png,image/webp"><img id="pf-preview" class="upload-preview mt-2 d-none" alt="Profile photo preview"></div>
    </div>
    <button type="button" class="btn btn-brand mt-4" id="prof-save"><i class="bi bi-save"></i> Save profile</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/technician.js"></script>
<script>document.getElementById('logout-link-2')?.addEventListener('click',e=>{e.preventDefault();window.HSP.logout();});
setTimeout(()=>{const el=document.getElementById('tech-avatar');if(el){const n=document.getElementById('tech-name').textContent;el.textContent=n.split(' ').map(x=>x[0]).join('').slice(0,2)||'T';}},50);</script>
</body>
</html>
